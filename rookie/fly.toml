# Fly.io · despliegue de Rookie (fase E). Ver planteamineto/DESPLIEGUE.md.
# Secretos (EQUIPO_TOKEN, OPENROUTER_API_KEY) van con `fly secrets set`, nunca aquí.
app = "rookie-reto1"
primary_region = "bog"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[deploy]
  strategy = "immediate"

# UNA sola máquina siempre encendida: el estado de las tareas vive en memoria del
# proceso. Con dos máquinas GET /tasks/{id} caería en la otra; si se apaga, se pierden.
[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    soft_limit = 80
    hard_limit = 100

  # /health exige Bearer y un check HTTP sin header recibiría 401: check TCP.
  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
