# Selección real consultando GET /models de OpenRouter (10-oct-2026).
# Solo usamos OPENROUTER_API_KEY; todo por /chat/completions.

# Claude más reciente con visión; Sonnet priorizado por latencia sobre Opus.
orquestador:
  modelo: anthropic/claude-sonnet-5.5
  timeout_s: 25
  max_tokens: 900

# Mismo criterio para el rol que toma decisiones paso a paso.
ejecutor:
  modelo: anthropic/claude-sonnet-5.5
  timeout_s: 25
  max_tokens: 900

# Juez con visión de proveedor distinto (OpenAI), usando su variante más reciente listada.
juez:
  modelo: openai/gpt-5.6-luna-pro
  timeout_s: 25
  max_tokens: 900

# Respaldo de visión: Qwen-VL más reciente disponible en catálogo OpenRouter.
vision_respaldo:
  modelo: qwen/qwen3-vl-235b-a22b-instruct
  timeout_s: 25
  max_tokens: 900
