[project]
name = "rookie"
version = "0.1.0"
description = "Agente que aprende a operar sistemas sin API, por VNC, como lo haría un empleado nuevo"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "numpy",
    "pillow",
    "opencv-python-headless",
    "rapidocr-onnxruntime",
    "imagehash",
    "pydantic",
    "instructor",
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rookie"]
